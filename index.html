  <body>
    <div id="root"></div>
    <!-- Hidden copies of the site's forms so Netlify Forms can detect their fields at deploy time. -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="inquiry_type" /><input name="full_name" /><input name="email" />
      <input name="phone" /><input name="preferred_date" /><input name="experience_level" /><textarea name="message"></textarea>
    </form>
    <form name="order" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="customer_name" /><input name="email" /><input name="phone" />
      <textarea name="notes"></textarea><textarea name="items"></textarea><input name="total" />
    </form>
